# Firestick Cleanup - launcher and add-on definitions
#
# Shared by every implementation. Each [section] is one app. Keys:
#
#   type                  launcher | addon
#   name                  Display name
#   summary               One line shown in the launcher menu
#   package               Android package name
#   activity              Component to launch (package/.Activity)
#   accessibility         Accessibility service to enable, if the app has one
#   notification_listener Notification listener service to enable, if any
#   grant                 Space-separated permissions to grant with "pm grant"
#   source                github:owner/repo  (download latest release APK)
#                         manual:URL         (user must place the APK next to the script)
#   apk_glob              Space-separated filename patterns for a user-provided APK
#   fallback_url          Used when the GitHub API cannot be reached
#   needs_home_on_fire    yes if the launcher has no Home-button service of its own
#   note                  Lines shown to the user after the app is launched (repeatable)
#
# To add a launcher, add a section here. No code changes are needed.

[projectivy]
type=launcher
name=Projectivy Launcher
summary=Feature-rich launcher with its own Home-button service (recommended)
package=com.spocky.projengmenu
activity=com.spocky.projengmenu/.ui.home.MainActivity
accessibility=com.spocky.projengmenu/.services.ProjectivyAccessibilityService
notification_listener=com.spocky.projengmenu/.services.notification.NotificationListener
source=github:spocky/miproja1
apk_glob=ProjectivyLauncher-*.apk
fallback_url=https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk
needs_home_on_fire=no
note=1. Projectivy should now be on your screen
note=2. Open Projectivy Settings (long-press the center/select button)
note=3. Select 'General'
note=4. Enable 'Override current launcher'

[at4k]
type=launcher
name=AT4K Launcher
summary=Lightweight launcher; APK must be downloaded yourself from at4k.com
package=com.overdevs.at4k
activity=com.overdevs.at4k/.MainActivity
accessibility=com.overdevs.at4k/.Hra
source=manual:https://at4k.com/
apk_glob=AT4K*.apk at4k*.apk base.apk
needs_home_on_fire=no
note=1. AT4K should now be on your screen
note=2. Grant any permissions it asks for
note=3. Configure AT4K as you like

[couchy]
type=launcher
name=Couchy Launcher
summary=Minimal open-source launcher; pair with Home on Fire for the Home button
package=com.conreo.couchytv
activity=com.conreo.couchytv/.MainActivity
source=github:conreo/couchy-launcher
apk_glob=Couchy-Launcher-*.apk couchy*.apk
needs_home_on_fire=yes
note=1. Couchy should now be on your screen
note=2. Couchy has no Home-button service of its own. Home on Fire
note=   (installed next, if you chose it) redirects the Home button to it.

[homeonfire]
type=addon
name=Home on Fire
summary=Redirects the Home button to a launcher of your choice
package=io.github.toolicious.homeonfire
activity=io.github.toolicious.homeonfire/.MainActivity
accessibility=io.github.toolicious.homeonfire/.HijackService
grant=android.permission.WRITE_SECURE_SETTINGS
source=github:toolicious/home-on-fire
apk_glob=home-on-fire*.apk
note=1. Home on Fire should now be on your screen
note=2. Select 'Choose target app...' and pick your new launcher
note=3. Make sure the 'Accessibility service' switch is ON
note=   (Fire OS 7: Home presses take a few seconds. Fire OS 8: a brief flash.)
note=   Long-press Home at any time to get back to the Amazon home screen.
