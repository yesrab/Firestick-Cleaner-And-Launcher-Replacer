# Firestick Cleanup - launcher and add-on definitions
#
# Shared by every implementation. Each [section] is one app. Keys:
#
#   type                  launcher | addon
#   name                  Display name
#   summary               One line shown in the launcher menu
#   package               Android package name
#   activity              Component to launch (package/.Activity)
#   accessibility         Accessibility service to enable, if the app has one
#   notification_listener Notification listener service to enable, if any
#   grant                 Space-separated permissions to grant with "pm grant" (verified afterwards)
#   appops                Space-separated app ops to allow with "appops set", e.g. SYSTEM_ALERT_WINDOW
#   boot                  yes if the app must come up at boot: it is put on the doze whitelist,
#                         allowed to run in the background, kept in the "active" standby bucket,
#                         and after the reboot the tool checks that it is running
#   source                github:owner/repo    download the latest release APK (SHA-256 verified)
#                         apkmirror:<package>  look up the newest variant that fits the device's
#                                              Android API level and CPU, then open that page in
#                                              the browser for the one click APKMirror requires;
#                                              the script watches your Downloads folder and
#                                              checks the signing certificate it reported
#                         manual:URL           user must place the APK next to the script
#   page                  (apkmirror) app page to open when the metadata lookup fails
#   asset_match           (github) glob for the release asset; {abi} is replaced by each of the
#                         device's CPU ABIs in turn, then "universal"
#   apk_glob              Space-separated filename patterns for a user-provided APK
#   fallback_url          Used when the GitHub API cannot be reached
#   needs                 (launchers) space-separated add-on keys this launcher needs;
#                         those add-ons default to "yes" when the launcher is chosen
#   prompt                (add-ons) the Y/N question asked for this add-on
#   default               (add-ons) yes | no  - default answer when the launcher
#                         does not list the add-on under "needs"
#   disables              (add-ons) space-separated packages to disable once the
#                         add-on is installed (recorded, so --revert re-enables them)
#   note                  Lines shown to the user after the app is launched (repeatable)
#
# Launchers are offered as a numbered menu; add-ons are offered one by one as
# Y/N questions, in file order, and can be forced with --with/--without <key>.
# To add a launcher or an add-on, add a section here. No code changes are needed.

[projectivy]
type=launcher
name=Projectivy Launcher
summary=Feature-rich launcher with its own Home-button service (recommended)
package=com.spocky.projengmenu
activity=com.spocky.projengmenu/.ui.home.MainActivity
accessibility=com.spocky.projengmenu/com.spocky.projengmenu.services.ProjectivyAccessibilityService
notification_listener=com.spocky.projengmenu/com.spocky.projengmenu.services.notification.NotificationListener
appops=SYSTEM_ALERT_WINDOW
boot=yes
source=github:spocky/miproja1
apk_glob=ProjectivyLauncher-*.apk
fallback_url=https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk
note=1. Projectivy should now be on your screen
note=2. Open Projectivy Settings (long-press the center/select button)
note=3. Select 'General'
note=4. Enable 'Override current launcher' so the Home button opens Projectivy
note=   (leave it OFF if you install Home on Fire: the two hooks conflict)

[at4k]
type=launcher
name=AT4K Launcher
summary=Paid launcher sold on Google Play (at4klauncher.com); you must supply the APK yourself
package=com.overdevs.at4k
activity=com.overdevs.at4k/.MainActivity
accessibility=com.overdevs.at4k/com.overdevs.at4k.Hra
appops=SYSTEM_ALERT_WINDOW
boot=yes
source=manual:https://at4klauncher.com/
apk_glob=AT4K*.apk at4k*.apk base.apk
note=1. AT4K should now be on your screen
note=2. Grant any permissions it asks for
note=3. Configure AT4K as you like

[couchy]
type=launcher
name=Couchy Launcher
summary=Minimal open-source launcher; pair with Home on Fire for the Home button
package=com.conreo.couchytv
activity=com.conreo.couchytv/.MainActivity
appops=SYSTEM_ALERT_WINDOW
boot=yes
source=github:conreo/couchy-launcher
apk_glob=Couchy-Launcher-*.apk couchy*.apk
needs=homeonfire
note=1. Couchy should now be on your screen
note=2. Couchy has no Home-button service of its own. Home on Fire
note=   (installed next, if you chose it) redirects the Home button to it.

[homeonfire]
type=addon
name=Home on Fire
summary=Redirects the Home button to your launcher (required for Couchy, optional for Projectivy and AT4K)
prompt=Install Home on Fire?
default=no
package=io.github.toolicious.homeonfire
activity=io.github.toolicious.homeonfire/.MainActivity
accessibility=io.github.toolicious.homeonfire/io.github.toolicious.homeonfire.HijackService
grant=android.permission.WRITE_SECURE_SETTINGS
boot=yes
source=github:toolicious/home-on-fire
apk_glob=home-on-fire*.apk
note=1. Home on Fire should now be on your screen
note=2. Select 'Choose target app...' and pick your new launcher
note=3. Check that 'Accessibility service' and 'Launch on boot' are both ON
note=   (they are on by default; the tool has already granted the permission)
note=4. If you also use Projectivy, turn OFF 'Override current launcher' in
note=   Projectivy: the two Home-button hooks conflict
note=   (Fire OS 7: Home presses take a few seconds. Fire OS 8: a brief flash.)
note=   Long-press Home at any time to get back to the Amazon home screen.

[youtubetv]
type=addon
name=YouTube for Android TV
summary=Google's official Android TV YouTube app in place of Amazon's Fire TV wrapper (one click in your browser)
prompt=Replace the Fire TV YouTube app with Google's official YouTube for Android TV?
default=no
package=com.google.android.youtube.tv
source=apkmirror:com.google.android.youtube.tv
page=https://www.apkmirror.com/apk/google-inc/youtube-for-android-tv-android-tv/
apk_glob=com.google.android.youtube.tv_*.apk YouTube*.apk youtube*.apk
disables=com.amazon.firetv.youtube
note=1. YouTube for Android TV should now be on your screen
note=2. The Amazon Fire TV YouTube app was disabled so only one YouTube shows
note=   in your launcher (--revert brings it back)
note=3. To sign in, use the on-screen code at youtube.com/activate. On some
note=   Fire OS versions sign-in needs Google services and will not work; the
note=   app still plays everything signed out. SmartTube signs in without them.

[googleapp]
type=addon
name=Google app for Android TV
summary=Google Assistant / voice search app (experimental: needs Google Play Services, which Fire OS lacks)
prompt=Install the Google app for Android TV? (experimental: it needs Google Play Services, which Fire OS does not have)
default=no
package=com.google.android.katniss
source=apkmirror:com.google.android.katniss
page=https://www.apkmirror.com/apk/google-inc/google-app-for-android-tv-android-tv/
apk_glob=com.google.android.katniss_*.apk
note=1. The Google app is installed. On Fire OS it may refuse to start or ask for
note=   Google Play Services, which cannot be installed without root.
note=   --revert removes it again.

[smarttube]
type=addon
name=SmartTube
summary=Open-source YouTube client for TVs: ad-free, signs in with a code, needs no Google services
prompt=Install SmartTube (ad-free YouTube client that signs in without Google services)?
default=no
package=org.smarttube.stable
source=github:yuliskov/SmartTube
asset_match=SmartTube_stable_*_{abi}.apk
apk_glob=SmartTube*.apk
note=1. SmartTube should now be on your screen
note=2. To sign in: SmartTube Settings > Accounts > Add account, then enter the
note=   code at youtube.com/activate on your phone or computer
note=3. The Amazon YouTube app is left in place; pick the YouTube for Android TV
note=   add-on as well if you want it disabled
