# Firestick Cleanup - shared package list
#
# This file is the single source of truth for every implementation
# (common/firestick-cleanup.sh, windows/*.ps1 and windows/WinformVer).
#
# Format
#   [group-key] Prompt text shown to the user
#   com.example.package        # optional description
#
# - The [always] group is disabled without asking.
# - Every other group is offered as a Y/N question, in file order.
# - Group keys are lower-case letters, digits, "-" and "_" only; they are
#   what you pass to --disable (for example: --disable video,appstore).
# - Packages that are not installed on the device are skipped silently.
# - Packages Amazon protects on a given firmware are reported as "Protected".

[always]
# Ads, tracking and telemetry
com.amazon.tv.acr                               # Automatic Content Recognition - tracks what you watch on screen
com.amazon.hybridadidservice                    # Advertising ID service for targeted ads
com.amazon.perfc                                # Performance data collection
com.amazon.perfcollection                       # Performance collection service
com.amazon.device.telemetry.emitter             # Sends device telemetry to Amazon
com.amazon.wirelessmetrics.service              # WiFi / Bluetooth usage metrics
# Shopping
com.amazon.shoptv.client                        # Shop from TV
com.amazon.shoptv.firetv.client                 # Fire TV shopping overlay
# Screensaver and UI bloat
com.amazon.ftv.screensaver                      # Ad-filled screensaver
com.amazon.tv.ftvambient                        # Ambient mode with Amazon content
com.amazon.sneakpeek                            # Promotional preview popups
com.amazon.tv.turnstile                         # "Recommended" content rows (mostly ads)
com.amazon.tv.notificationcenter                # Promotional notification center (Fire OS 7/8 name)
com.amazon.notificationcenter                   # Promotional notification center (name seen on some builds)
com.amazon.tv.releasenotes                      # "What's new" screens after updates
com.amazon.storm.lightning.tutorial             # First-run tutorial
com.amazon.tmm.tutorial                         # Tutorial manager
# Background services
com.amazon.logan                                # Log agent
com.amazon.fireos.cirruscloud                   # Cloud sync service
com.amazon.ods.kindleconnect                    # Kindle device linking
com.amazon.tahoe                                # Content delivery service
com.amazon.aria                                 # Background service framework
com.amazon.hedwig                               # Push notification delivery
com.amazon.tv.support                           # Remote support / diagnostics
com.amazon.ceviche                              # A/B testing and experimentation
com.amazon.d3                                   # Device data service
com.amazon.device.rdmapplication                # Remote device management
com.amazon.wifilocker                           # Shares your WiFi password with Amazon
com.amazon.spiderpork                           # Background analytics
com.amazon.firebat                              # Power analytics
com.amazon.ssm                                  # Systems manager agent
com.amazon.ssmsys                               # Systems manager system service
com.amazon.tv.easyupgrade                       # "Upgrade your Fire TV" prompts
com.amazon.dpcclient                            # Device policy controller
com.amazon.sharingservice.android.client.proxy  # Cross-device sharing
com.amazon.privacypassservice                   # Privacy token service
com.amazon.tv.legal.notices                     # Legal notice screens

[video] Disable Amazon Video services? Answer N if you use Prime Video, Freevee or MiniTV, or playback will break.
com.amazon.avls.experience                      # Amazon Video Licensing Service (DRM)
com.amazon.prism.android.service                # Media playback framework
com.amazon.dp.logger                            # Digital Products logger, required by Prime Video
com.amazon.livedeviceservice                    # Live streaming coordination
com.amazon.rtcsessioncontroller                 # Streaming session manager
com.amazon.client.metrics.api                   # Metrics API many Amazon apps need to start

[appstore] Disable Amazon Appstore?
com.amazon.venezia                              # Amazon Appstore (you can still sideload apps)

[photos] Disable Amazon Photos?
com.amazon.bueller.photos                       # Amazon Photos

[music] Disable Amazon Music?
com.amazon.bueller.music                        # Amazon Music

[freevee] Disable Freevee / IMDb TV?
com.amazon.imdb.tv.android.app                  # Freevee / IMDb TV

[minitv] Disable Amazon MiniTV?
com.amazon.minitv.android.app                   # MiniTV short-form video

[gamehub] Disable Amazon Game Hub?
com.amazon.gamehub                              # Game discovery

[livetv] Disable Amazon Live TV?
com.amazon.tv.livetv                            # Live TV integration

[alexa] Disable Alexa alerts and notifications?
com.amazon.tv.alexaalerts                       # Alexa on-screen alerts
com.amazon.tv.alexanotifications                # Alexa push notifications
com.amazon.audiohome                            # Alexa audio / smart home dashboard

[silk] Disable Silk Browser?
com.amazon.cloud9                               # Silk web browser

[smarthome] Disable Smart Home features?
com.amazon.smarthomemapviewapp                  # Alexa smart home floor plan

[whisperplay] Disable WhisperPlay (second-screen casting)?
com.amazon.whisperplay.service.install          # WhisperPlay casting service

[updates] Block Fire OS update services? Updates re-enable bloat and may remove your launcher, but you also stop getting security fixes.
com.amazon.device.update.service                # Device update service
com.amazon.fvp.update.service                   # FVP update service
com.amazon.device.software.ota                  # OTA update service (protected on most firmware)
com.amazon.device.software.ota.override         # OTA override (protected on most firmware)
com.amazon.tv.forcedotaupdater.v2               # Forced OTA updater (protected on most firmware)

[stocklauncher] Disable the Amazon stock launcher? Only works on some firmware. Do this ONLY after your new launcher is confirmed working; Settings stay reachable and --revert undoes it.
com.amazon.tv.launcher                          # Stock Fire TV home screen (~110 MB RAM when running)
com.amazon.tv.selectivepause                    # Stock launcher helper
